<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del producto | Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
  </head>

  <body>
    <div id="header"></div>

    <main class="store-main">
      <a class="back-link" href="../home/home.html">← Volver al catálogo</a>

      <p id="message" class="message" role="status" aria-live="polite">
        Cargando producto...
      </p>

      <section id="product-detail" hidden>
        <div class="product-detail-layout">
          <img id="product-image" class="product-detail-image" alt="">

          <div class="product-detail-info">
            <h2 id="product-name"></h2>
            <p id="product-description"></p>
            <p id="product-price" class="product-price"></p>
            <p id="product-stock"></p>
            <span id="product-status" class="availability-badge"></span>

            <form id="add-form" class="quantity-form" hidden>
              <div class="form-group">
                <label for="quantity">Cantidad</label>
                <input
                  type="number"
                  id="quantity"
                  name="quantity"
                  min="1"
                  step="1"
                  value="1"
                  required
                >
              </div>

              <button id="add-button" type="submit" class="primary-button">
                Agregar al carrito
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Food Store</p>
    </footer>

    <script type="module" src="./productDetail.ts"></script>
  </body>
</html>
