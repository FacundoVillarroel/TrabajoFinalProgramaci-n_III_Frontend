<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis pedidos | Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
  </head>

  <body>
    <div id="header"></div>

    <main class="mx-auto max-w-5xl p-5">
      <h2>Mis pedidos</h2>

      <p id="message" class="message" role="status" aria-live="polite">
        Cargando pedidos...
      </p>

      <button id="retry-button" type="button" class="secondary-button mb-5" hidden>
        Reintentar
      </button>

      <section id="empty-orders" class="rounded-xl bg-white p-8 text-center" hidden>
        <h3 class="text-xl font-bold">Todavía no tenés pedidos</h3>
        <p>Cuando confirmes una compra, aparecerá en esta sección.</p>
        <a href="../../store/home/home.html" class="primary-button">
          Ir a la tienda
        </a>
      </section>

      <div id="orders-container" class="space-y-5"></div>
    </main>

    <footer>
      <p>Food Store</p>
    </footer>

    <script type="module" src="./orders.ts"></script>
  </body>
</html>
