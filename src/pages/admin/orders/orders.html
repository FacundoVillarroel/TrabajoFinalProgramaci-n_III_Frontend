<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de pedidos | Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
  </head>

  <body>
    <div id="header"></div>

    <main class="mx-auto max-w-5xl p-5">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <h2 class="mb-0">Gestión de pedidos</h2>

        <div class="form-group mb-0">
          <label for="state-filter">Filtrar por estado</label>
          <select id="state-filter" disabled>
            <option value="">Todos</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="CONFIRMADO">Confirmado</option>
            <option value="TERMINADO">Terminado</option>
            <option value="CANCELADO">Cancelado</option>
          </select>
        </div>
      </div>

      <p id="message" class="message" role="status" aria-live="polite">
        Cargando pedidos...
      </p>

      <button id="retry-button" type="button" class="secondary-button mb-5" hidden>
        Reintentar
      </button>

      <p id="empty-message" class="rounded-xl bg-white p-6" hidden>
        No hay pedidos para el estado seleccionado.
      </p>

      <div id="orders-container" class="space-y-5"></div>
    </main>

    <footer>
      <p>Food Store</p>
    </footer>

    <script type="module" src="./orders.ts"></script>
  </body>
</html>
