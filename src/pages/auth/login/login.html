<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
  </head>

  <body class="auth-body">
    <main class="auth-container">
      <section class="auth-card" aria-labelledby="login-title">
        <h1>Food Store</h1>
        <h2 id="login-title">Iniciar sesión</h2>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              placeholder="usuario@email.com"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            >
          </div>

          <p id="message" class="message" role="alert"></p>

          <button id="login-button" type="submit" class="primary-button">
            Ingresar
          </button>
        </form>

        <p class="auth-link">
          ¿Todavía no tenés cuenta?
          <a href="../register/register.html">Registrate</a>
        </p>
      </section>
    </main>

    <script type="module" src="./login.ts"></script>
  </body>
</html>
