<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
  </head>

  <body class="auth-body">
    <main class="auth-container">
      <section class="auth-card" aria-labelledby="register-title">
        <h1>Food Store</h1>
        <h2 id="register-title">Crear cuenta</h2>

        <form id="register-form">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input
              type="text"
              id="name"
              name="name"
              autocomplete="given-name"
              placeholder="Tu nombre"
              required
            >
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              placeholder="usuario@email.com"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              minlength="6"
              aria-describedby="password-help"
              required
            >
            <small id="password-help">Mínimo 6 caracteres.</small>
          </div>

          <div class="form-group">
            <label for="repeat-password">Repetir contraseña</label>
            <input
              type="password"
              id="repeat-password"
              name="repeat-password"
              autocomplete="new-password"
              minlength="6"
              required
            >
          </div>

          <p id="message" class="message" role="alert"></p>

          <button id="register-button" type="submit" class="primary-button">
            Registrarme
          </button>
        </form>

        <p class="auth-link">
          ¿Ya tenés cuenta?
          <a href="../login/login.html">Iniciar sesión</a>
        </p>
      </section>
    </main>

    <script type="module" src="./register.ts"></script>
  </body>
</html>
